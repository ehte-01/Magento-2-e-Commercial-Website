Listen 8080

# ─── Internal Magento backend (port 8080) ───
<VirtualHost *:8080>
    ServerName 139.59.26.156
    DocumentRoot /var/www/magento2/pub

    <Directory /var/www/magento2/pub>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/magento2>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>

    ErrorLog /var/log/apache2/magento_error.log
    CustomLog /var/log/apache2/magento_access.log combined
</VirtualHost>

# ─── Public frontend: React SPA + Magento API proxy (port 80) ───
<VirtualHost *:80>
    ServerName 139.59.26.156
    DocumentRoot /var/www/thrift-frontend

    <Directory /var/www/thrift-frontend>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [L]
    </Directory>

    # Proxy Magento paths to internal backend
    ProxyPreserveHost On

    ProxyPass /adminpanel http://127.0.0.1:8080/adminpanel
    ProxyPassReverse /adminpanel http://127.0.0.1:8080/adminpanel

    ProxyPass /rest http://127.0.0.1:8080/rest
    ProxyPassReverse /rest http://127.0.0.1:8080/rest

    ProxyPass /graphql http://127.0.0.1:8080/graphql
    ProxyPassReverse /graphql http://127.0.0.1:8080/graphql

    ProxyPass /static http://127.0.0.1:8080/static
    ProxyPassReverse /static http://127.0.0.1:8080/static

    ProxyPass /media http://127.0.0.1:8080/media
    ProxyPassReverse /media http://127.0.0.1:8080/media

    ProxyPass /pub http://127.0.0.1:8080/pub
    ProxyPassReverse /pub http://127.0.0.1:8080/pub

    ProxyPass /setup http://127.0.0.1:8080/setup
    ProxyPassReverse /setup http://127.0.0.1:8080/setup

    ErrorLog /var/log/apache2/thrift_frontend_error.log
    CustomLog /var/log/apache2/thrift_frontend_access.log combined
</VirtualHost>
